# ============================================================
# 敏感配置模板
# 注意：application-secret.yml 已被 .gitignore 忽略，切勿提交到仓库。
# ============================================================

# 数据库连接密码（docker pgvector/pgvector:pg17 默认 123456）
spring:
  datasource:
    password: 123456

# JWT 登录令牌签名密钥（任意 ≥32 位字符串）
jwt:
  secret-key: your-jwt-secret-key-at-least-32-bytes-long

# 大模型配置（警情智能问答 /knowledge-chunks/chat）
llm:
  api-key: sk-xxx
  base-url: https://api.openai.com
  model: gpt-4o-mini
  # 向量化配置（RAG 知识库检索）
  embedding-api-key: sk-xxx
  embedding-base-url: https://api.jina.ai/v1
  embedding-model: jina-embeddings-v2-base-zh
  # RAG 检索返回的相似文档数量
  top-k: 3

# MQTT（EMQX）认证信息
# 若 EMQX 未启用认证，删除本段或留空即可。
mqtt:
  username: admin
  password: 123456
