# ============================================================
# 敏感配置模板
# 注意：application-secret.yml 已被 .gitignore 忽略，切勿提交到仓库。
# ============================================================

# 数据库连接密码（docker pgvector/pgvector:pg17 默认 123456）
spring:
  datasource:
    password: 123456

# JWT 登录令牌签名密钥（任意 ≥32 位字符串）
jwt:
  secret-key: your-jwt-secret-key-at-least-32-bytes-long

# 大模型配置（警情智能问答 /knowledge-chunks/chat）
# 推荐：硅基流动 SiliconFlow（OpenAI 兼容，注册送免费额度，国内直连）
# 注册 https://cloud.siliconflow.cn 拿到 API Key，填入下方 api-key 与 embedding-api-key（同一个 key）
llm:
  api-key: sk-你的硅基流动key
  base-url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen2.5-7B-Instruct
  # 向量化配置（RAG 知识库检索，与对话模型同一平台同一 key）
  embedding-api-key: sk-你的硅基流动key
  embedding-base-url: https://api.siliconflow.cn/v1
  embedding-model: BAAI/bge-m3
  # RAG 检索返回的相似文档数量
  top-k: 3
  # 知识文档切分块大小（字符数）与重叠字符数
  chunk-size: 500
  chunk-overlap: 50
  # 多轮对话携带的历史消息条数
  max-history: 6
  # 向量检索余弦距离阈值（0=完全相同，越小越严格；0.75 保召回，过滤完全无关长句）
  rag:
    similarity-threshold: 0.75

# AI 视觉复核配置（FIRE 告警自动触发，结果推送 /topic/ai-review）
ai-review:
  # 默认摄像头快照 URL（仿真模式：无电脑摄像头/截图失败时的降级图片，可配置为一张测试火情图片的直链）
  default-snapshot-url: https://example.com/test-fire-snapshot.jpg
  # 视觉大模型名称（SiliconFlow 平台支持的视觉模型，如 Qwen/Qwen3-VL-8B-Instruct）
  vision-model: Qwen/Qwen3-VL-8B-Instruct
  # 本机电脑摄像头截图（AI 分析用现场图；失败自动降级为上方 default-snapshot-url 仿真图）
  camera-enabled: true
  # 本机摄像头 dshow 设备名，查看命令: ffmpeg -list_devices true -f dshow -i dummy
  camera-name: USB2.0 HD UVC WebCam
  # ffmpeg 可执行文件路径（Windows 从 https://www.gyan.dev/ffmpeg/builds/ 下载或 winget install Gyan.FFmpeg）
  ffmpeg-path: C:/tools/ffmpeg.exe
  # 截图保存目录（通过 /images/ai-review/** 对外访问）
  snapshot-dir: uploads/ai-review

# MQTT（EMQX）认证信息
# 若 EMQX 未启用认证，删除本段或留空即可。
mqtt:
  username: admin
  password: 123456
