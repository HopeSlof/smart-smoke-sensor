server:
  port: 8080

spring:
  application:
    name: smart-smoke-sensor
  profiles:
    include: secret  # 引入敏感配置 application-secret.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/smart-smoke-sensor
    username: postgres
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cqu.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cqu:
      mapper: warn
      service: info
      controller: info

# ==================== MQTT 配置（连接 EMQX Broker） ====================
mqtt:
  broker-url: tcp://localhost:1883
  client-id: smart-smoke-sensor-server
  username:
  password:

# ==================== AI 视觉复核配置 ====================
ai-review:
  # 默认摄像头快照 URL（无真实摄像头时使用，可配置为测试火情图片）
  default-snapshot-url:
  # 视觉大模型名称（SiliconFlow 平台支持的视觉模型）
  vision-model: Qwen/Qwen2-VL-72B-Instruct
  # 本机电脑摄像头截图（AI 分析现场图；失败自动降级为 default-snapshot-url 仿真模式）
  camera-enabled: true
  # 本机摄像头 dshow 设备名（在 secret 配置中按机器覆盖，查看: ffmpeg -list_devices true -f dshow -i dummy）
  camera-name:
  # ffmpeg 可执行文件路径
  ffmpeg-path: ffmpeg
  # 截图保存目录（通过 /images/ai-review/** 对外访问，前端可直接展示）
  snapshot-dir: uploads/ai-review
