server:
  port: 8080

spring:
  application:
    name: smart-smoke-sensor
  profiles:
    include: secret  # 引入敏感配置 application-secret.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/smart-smoke-sensor
    username: postgres
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cqu.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cqu:
      mapper: warn
      service: info
      controller: info

# ==================== MQTT 配置（连接 EMQX Broker） ====================
mqtt:
  broker-url: tcp://localhost:1883
  client-id: smart-smoke-sensor-server
  username:
  password:
